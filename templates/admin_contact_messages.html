<!DOCTYPE html>
<html>
<head>
    <title>Contact Messages</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f8f9;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #078b87;
        }

        .back-btn {
            display: inline-block;
            background: #078b87;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #078b87;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="{{ url_for('admin_dashboard') }}" class="back-btn">
        ← Back to Dashboard
    </a>

    <h1>Contact Messages</h1>

    {% if messages %}

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Subject</th>
                <th>Message</th>
            </tr>
        </thead>

        <tbody>

        {% for msg in messages %}

            <tr>
                <td>{{ msg.id }}</td>
                <td>{{ msg.name }}</td>
                <td>{{ msg.email }}</td>
                <td>{{ msg.phone or '-' }}</td>
                <td>{{ msg.subject }}</td>
                <td>{{ msg.message }}</td>
            </tr>

        {% endfor %}

        </tbody>

    </table>

    {% else %}

        <p>No contact messages found.</p>

    {% endif %}

</div>

</body>
</html>
