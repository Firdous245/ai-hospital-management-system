<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ================= BASIC META ================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AI Hospital Management System - Smart and secure healthcare management platform."
    >

    <meta
        name="author"
        content="AI Hospital Management System"
    >


    <!-- ================= PAGE TITLE ================= -->

    <title>

        {% block title %}

        AI Hospital Management System

        {% endblock %}

    </title>


    <!-- ================= BOOTSTRAP ================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ================= FONT AWESOME ================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- ================= MAIN WEBSITE CSS ================= -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >


    <!-- ================= PAGE-SPECIFIC CSS ================= -->

    {% block page_css %}

    {% endblock %}

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    {% include 'includes/navbar.html' %}



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main>

        {% block content %}

        {% endblock %}

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    {% include 'includes/footer.html' %}



    <!-- =====================================================
         BOOTSTRAP JAVASCRIPT
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- =====================================================
         CUSTOM JAVASCRIPT
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/main.js') }}">
    </script>


</body>

</html>
